server.port=8098

# H2 file DB (local). Change path if you move the project.
spring.datasource.url=jdbc:h2:file:./lesson53-tasks;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=Lesson53LearningSecretKeyMustBeAtLeast32BytesLong!
app.jwt.expiration-ms=3600000

# ===== Lesson 53: Actuator (production health / metrics) =====
# Base path for all management endpoints
management.endpoints.web.base-path=/actuator
# Expose useful endpoints over HTTP (never expose everything in real prod)
management.endpoints.web.exposure.include=health,info,metrics,loggers
# Show details on /actuator/health (UP/DOWN + components)
management.endpoint.health.show-details=when_authorized
# App identity shown on /actuator/info
info.app.name=Lesson53 Tasks API
info.app.lesson=Actuator and Logging
info.app.java=21

# ===== Lesson 53: Logging (SLF4J + Logback, built into Spring Boot) =====
# Levels: TRACE < DEBUG < INFO < WARN < ERROR
logging.level.root=INFO
logging.level.lesson53=DEBUG
# Quieter framework noise while learning
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
# Pattern: time | level | logger | message
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
