server.port=8086

# Use ABSOLUTE path so H2 Console can connect with the same URL
spring.datasource.url=jdbc:h2:file:/Users/shashwatmishra/Developer/Project/JAVA/JAVA_Basics/lesson41-springboot-jpa/lesson41-tasks;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: create/update tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console: http://localhost:8086/h2-console
# Paste this exact JDBC URL (do NOT use jdbc:h2:~/test):
# jdbc:h2:file:/Users/shashwatmishra/Developer/Project/JAVA/JAVA_Basics/lesson41-springboot-jpa/lesson41-tasks;AUTO_SERVER=TRUE
# User: sa   Password: (leave empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
